<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Speed Dash! ⚡</title>
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body {
    background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
    min-height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #333;
  }
  .card {
    background: #ffffff;
    border-radius: 20px;
    padding: 30px;
    width: 90%;
    max-width: 500px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    text-align: center;
    position: relative;
    overflow: hidden;
    transition: transform 0.1s;
  }
  
  /* Screen Shake Animation for wrong answers */
  .shake {
    animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
  }
  @keyframes shake {
    10%, 90% { transform: translate3d(-3px, 0, 0); }
    20%, 80% { transform: translate3d(4px, 0, 0); }
    30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
    40%, 60% { transform: translate3d(6px, 0, 0); }
  }

  h1 { margin-top: 0; color: #1e3c72; font-size: 2.2rem; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px;}
  
  .rank-title {
    font-size: 1.1rem;
    font-weight: 800;
    color: #ff7b00;
    margin-bottom: 15px;
    text-transform: uppercase;
  }

  /* XP / Leveling System */
  .xp-container {
    background: #e0e0e0;
    border-radius: 10px;
    height: 12px;
    width: 100%;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
  }
  .xp-fill {
    background: linear-gradient(90deg, #43e97b 0%, #38f9d7 100%);
    height: 100%;
    width: 0%;
    transition: width 0.3s ease-out;
  }
  .level-badge {
    background: #1e3c72;
    color: white;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 0.8rem;
    font-weight: bold;
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
  }

  .stats-bar {
    display: flex;
    justify-content: space-around;
    background: #f0f4f8;
    padding: 10px;
    border-radius: 12px;
    margin-bottom: 20px;
    font-weight: bold;
  }
  .stat-item { display: flex; flex-direction: column; }
  .stat-label { font-size: 0.75rem; text-transform: uppercase; color: #666; }
  .stat-value { color: #1e3c72; font-size: 1.4rem; }
  
  .controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; }
  select {
    padding: 8px; border-radius: 8px; border: 2px solid #1e3c72;
    background: #fff; font-weight: bold; color: #1e3c72; cursor: pointer;
  }

  .question-box {
    font-size: 4rem;
    font-weight: 900;
    color: #111;
    margin: 10px 0 20px 0;
    text-shadow: 2px 2px 0px #e0e0e0;
  }

  .input-group { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; }
  input[type="number"] {
    font-size: 2.2rem; width: 130px; text-align: center;
    border: 4px solid #1e3c72; border-radius: 12px; outline: none; padding: 5px;
    font-weight: bold; color: #333;
  }
  input[type="number"]::-webkit-inner-spin-button, 
  input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  
  .submit-btn {
    font-size: 1.3rem; padding: 10px 20px; border-radius: 12px; border: none;
    background: linear-gradient(135deg, #ff7b00, #ff5100);
    color: white; font-weight: bold; cursor: pointer;
    box-shadow: 0 4px 0 #cc4100; transition: all 0.1s;
  }
  .submit-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #cc4100; }

  .mc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
  .mc-btn {
    font-size: 2rem; font-weight: 900; padding: 15px; border-radius: 12px;
    border: 4px solid #e0e0e0; background: #fff; color: #222;
    cursor: pointer; transition: all 0.1s ease;
    box-shadow: 0 5px 0 #cfcfcf;
  }
  .mc-btn:hover { background: #f0f8ff; border-color: #1e3c72; }
  .mc-btn:active { transform: translateY(5px); box-shadow: 0 0 0 #cfcfcf; }

  .feedback { height: 35px; font-size: 1.4rem; font-weight: 900; margin-top: 5px; text-transform: uppercase;}
  .correct { color: #2e7d32; animation: pop 0.3s ease-out; }
  .wrong { color: #d32f2f; }

  @keyframes pop {
    0% { transform: scale(0.8); opacity: 0; }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); opacity: 1; }
  }

  .streak-badge {
    position: absolute; top: 15px; right: -50px;
    background: #ffea00; color: #000; padding: 5px 40px;
    font-size: 0.9rem; font-weight: 900; transform: rotate(45deg);
    box-shadow: 0 2px 5px rgba(0,0,0,0.2); display: none;
  }

  .sound-toggle { margin-top: 15px; font-size: 0.85rem; color: #888; cursor: pointer; }
</style>
</head>
<body>

<div class="card" id="gameCard">
  <div class="streak-badge" id="streakBadge">COMBO!</div>
  <h1>Math Dash ⚡</h1>
  <div class="rank-title" id="rankTitle">Rank: Rookie 🥉</div>
  
  <div style="position: relative; margin-top: 15px;">
    <div class="level-badge" id="levelText">Lvl 1</div>
    <div class="xp-container"><div class="xp-fill" id="xpFill"></div></div>
  </div>

  <div class="stats-bar">
    <div class="stat-item"><span class="stat-label">Score</span><span class="stat-value" id="score">0</span></div>
    <div class="stat-item"><span class="stat-label">Streak</span><span class="stat-value" id="streak">0</span></div>
  </div>

  <div class="controls">
    <select id="modeSelect" onchange="changeMode()">
      <option value="type">Type Answer</option>
      <option value="mc">Multiple Choice</option>
    </select>
    <select id="rangeSelect" onchange="resetGame()">
      <option value="12">Tables 1-12</option>
      <option value="10">Tables 1-10</option>
      <option value="5">Tables 1-5</option>
    </select>
  </div>

  <div class="question-box" id="question">4 × 2</div>

  <div id="typeModeContainer">
    <form id="answerForm" onsubmit="handleTypeSubmit(event)">
      <div class="input-group">
        <input type="number" id="typeInput" autocomplete="off" autofocus placeholder="?">
        <button type="submit" class="submit-btn">GO 🚀</button>
      </div>
    </form>
  </div>

  <div id="mcModeContainer" class="mc-grid" style="display: none;">
    <button class="mc-btn" onclick="checkMcAnswer(this)"></button>
    <button class="mc-btn" onclick="checkMcAnswer(this)"></button>
    <button class="mc-btn" onclick="checkMcAnswer(this)"></button>
    <button class="mc-btn" onclick="checkMcAnswer(this)"></button>
  </div>

  <div class="feedback" id="feedback">Ready?</div>
  <div class="sound-toggle" id="soundToggle" onclick="toggleSound()">🔊 Sound: ON</div>
</div>

<script>
  let score = 0, streak = 0, level = 1, xp = 0;
  let num1 = 0, num2 = 0, correctAnswer = 0;
  let soundEnabled = true;

  const ranks = [
    { threshold: 0, title: "Rookie 🥉" },
    { threshold: 5, title: "Bench Player 🏏" },
    { threshold: 10, title: "Pro Athlete ⚽" },
    { threshold: 20, title: "All-Star ⭐" },
    { threshold: 35, title: "MVP 🏆" },
    { threshold: 50, title: "Legend 👑" }
  ];

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playSound(type) {
    if (!soundEnabled || audioCtx.state === 'suspended') return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === 'correct') {
      osc.type = 'square'; osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
      gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.15);
      osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'levelUp') {
      osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.1);
      osc.frequency.setValueAtTime(783.99, now + 0.2);
      osc.frequency.setValueAtTime(1046.50, now + 0.3);
      gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.6);
      osc.start(now); osc.stop(now + 0.6);
    } else {
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(80, now + 0.3);
      gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
    }
  }

  function toggleSound() {
    soundEnabled = !soundEnabled;
    if (soundEnabled && audioCtx.state === 'suspended') audioCtx.resume();
    document.getElementById('soundToggle').innerText = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
  }

  function generateQuestion() {
    const maxRange = parseInt(document.getElementById('rangeSelect').value);
    num1 = Math.floor(Math.random() * maxRange) + 1;
    num2 = Math.floor(Math.random() * maxRange) + 1;
    correctAnswer = num1 * num2;
    document.getElementById('question').innerText = `${num1} × ${num2}`;

    if (document.getElementById('modeSelect').value === 'type') {
      const input = document.getElementById('typeInput');
      input.value = ''; input.focus();
    } else {
      setupMultipleChoice(maxRange);
    }
  }

  function setupMultipleChoice(maxRange) {
    let options = [correctAnswer];
    let safetyCounter = 0;

    // Fixed loop: Guards against 1x1 infinite loop freezes
    while (options.length < 4 && safetyCounter < 100) {
      safetyCounter++;
      let wrong;
      
      // Mix of random adjacent numbers and random true products
      if (Math.random() < 0.5) {
        const offset = Math.floor(Math.random() * 5) + 1;
        wrong = correctAnswer + (Math.random() < 0.5 ? offset : -offset);
      } else {
        wrong = (Math.floor(Math.random() * maxRange) + 1) * (Math.floor(Math.random() * maxRange) + 1);
      }

      // Ensure >0 and unique
      if (wrong > 0 && !options.includes(wrong) && wrong !== correctAnswer) {
        options.push(wrong);
      }
    }
    
    // Ultimate fallback just in case
    while(options.length < 4) {
      let fallback = Math.floor(Math.random() * (maxRange * maxRange)) + 1;
      if(!options.includes(fallback)) options.push(fallback);
    }

    options.sort(() => Math.random() - 0.5);
    const buttons = document.querySelectorAll('.mc-btn');
    buttons.forEach((btn, idx) => {
      btn.innerText = options[idx];
      btn.style.backgroundColor = '#fff'; btn.style.borderColor = '#e0e0e0';
      btn.style.transform = 'translateY(0)'; btn.style.boxShadow = '0 5px 0 #cfcfcf';
    });
  }

  function handleTypeSubmit(e) {
    e.preventDefault();
    const val = parseInt(document.getElementById('typeInput').value);
    if (!isNaN(val)) val === correctAnswer ? onCorrect() : onWrong();
  }

  function checkMcAnswer(btn) {
    const chosen = parseInt(btn.innerText);
    if (chosen === correctAnswer) {
      btn.style.backgroundColor = '#c8e6c9'; btn.style.borderColor = '#2e7d32';
      onCorrect();
    } else {
      btn.style.backgroundColor = '#ffcdd2'; btn.style.borderColor = '#d32f2f';
      onWrong();
    }
  }

  function onCorrect() {
    score += 10; streak++;
    addXP(); updateRank();
    
    const feedbackEl = document.getElementById('feedback');
    const compliments = ["SWISH! 🏀", "GOAL! ⚽", "BOOM! 💥", "EPIC! ⚡", "NICE! 🎯"];
    feedbackEl.innerText = compliments[Math.floor(Math.random() * compliments.length)];
    feedbackEl.className = "feedback correct";

    if (streak > 0 && streak % 5 === 0) {
      document.getElementById('streakBadge').style.display = 'block';
      setTimeout(() => { document.getElementById('streakBadge').style.display = 'none'; }, 1500);
    }
    playSound('correct'); updateStats();
    setTimeout(generateQuestion, 400);
  }

  function onWrong() {
    streak = 0;
    triggerShake();
    const feedbackEl = document.getElementById('feedback');
    feedbackEl.innerText = `${num1} × ${num2} = ${correctAnswer}`;
    feedbackEl.className = "feedback wrong";
    playSound('wrong'); updateStats();
    setTimeout(generateQuestion, 1500);
  }

  function addXP() {
    xp += 25; // 4 questions to level up
    if (xp >= 100) {
      xp = 0; level++; playSound('levelUp');
      document.getElementById('levelText').innerText = 'Lvl ' + level;
    }
    document.getElementById('xpFill').style.width = xp + '%';
  }

  function updateRank() {
    let currentRank = ranks[0].title;
    for (let i = 0; i < ranks.length; i++) {
      if (level >= ranks[i].threshold) currentRank = ranks[i].title;
    }
    document.getElementById('rankTitle').innerText = 'Rank: ' + currentRank;
  }

  function triggerShake() {
    const card = document.getElementById('gameCard');
    card.classList.remove('shake');
    void card.offsetWidth; // trigger reflow
    card.classList.add('shake');
  }

  function updateStats() {
    document.getElementById('score').innerText = score;
    document.getElementById('streak').innerText = streak;
  }

  function changeMode() {
    const isType = document.getElementById('modeSelect').value === 'type';
    document.getElementById('typeModeContainer').style.display = isType ? 'block' : 'none';
    document.getElementById('mcModeContainer').style.display = isType ? 'none' : 'grid';
    generateQuestion();
  }

  function resetGame() { score = 0; streak = 0; level = 1; xp = 0; updateStats(); addXP(); generateQuestion(); }

  // Initialize
  document.addEventListener('click', () => { if (audioCtx.state === 'suspended') audioCtx.resume(); }, { once: true });
  generateQuestion();
</script>
</body>
</html>
