<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Mechanics Scratchpad 📝</title>
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  
  /* Base Theme (Blue/Green) */
  body {
    background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
    min-height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; color: #333;
    transition: background 0.5s ease;
  }
  
  /* Hot Pink Theme! */
  body.pink-mode {
    background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);
  }

  .card {
    background: #ffffff; border-radius: 20px; padding: 30px; width: 95%; max-width: 600px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; position: relative;
  }
  
  h1 { margin-top: 0; color: #111; font-size: 2rem; margin-bottom: 5px; }

  /* Theme Toggle Button */
  .theme-btn {
    position: absolute; top: 15px; right: 15px;
    background: #ff0844; color: white; border: none; padding: 8px 15px;
    border-radius: 20px; font-weight: bold; cursor: pointer;
    box-shadow: 0 3px 0 #c2002f; transition: all 0.1s;
  }
  .theme-btn:active { transform: translateY(3px); box-shadow: 0 0 0 #c2002f; }

  .controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 25px; flex-wrap: wrap; }
  select {
    padding: 8px 12px; border-radius: 8px; border: 2px solid #333;
    background: #fff; font-weight: bold; cursor: pointer; font-size: 1rem;
  }

  /* Math Grid Layout */
  .math-workspace {
    display: flex; flex-direction: column; align-items: center; margin-bottom: 20px;
  }
  
  .math-grid {
    display: grid; gap: 5px 10px; align-items: center; justify-items: center;
  }

  /* The little inputs above the numbers for carrying/borrowing */
  .scratch-input {
    width: 40px; height: 40px; text-align: center; font-size: 1.2rem; font-weight: bold;
    border: 2px dashed #aaa; border-radius: 8px; background: #f9f9f9; color: #d32f2f;
    outline: none;
  }
  .scratch-input:focus { border-color: #d32f2f; background: #fff; }

  /* The actual numbers */
  .digit-cell {
    font-size: 3.5rem; font-weight: 800; cursor: pointer; user-select: none;
    transition: all 0.2s; position: relative; width: 50px; text-align: center;
  }
  .digit-cell:hover::after {
    content: "cross out"; position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
    font-size: 0.7rem; background: #333; color: white; padding: 2px 6px; border-radius: 4px; white-space: nowrap;
  }
  
  /* Strike-through effect when clicked */
  .digit-cell.strike {
    color: #999;
  }
  .digit-cell.strike::before {
    content: ""; position: absolute; top: 50%; left: -5px; right: -5px;
    height: 4px; background: red; transform: rotate(-15deg);
  }
  .digit-cell.strike:hover::after { display: none; }

  .operator-cell { font-size: 3rem; font-weight: 800; margin-right: 10px; }
  
  /* Divider line before answer */
  .divider { grid-column: 1 / -1; width: 100%; height: 5px; background: #111; border-radius: 5px; margin: 10px 0; }

  /* Bottom answer inputs */
  .ans-input {
    width: 50px; height: 60px; text-align: center; font-size: 2.5rem; font-weight: bold;
    border: 3px solid #333; border-radius: 10px; outline: none;
  }
  .ans-input:focus { border-color: #2196f3; box-shadow: 0 0 10px rgba(33,150,243,0.3); }

  .submit-btn {
    font-size: 1.5rem; padding: 12px 30px; border-radius: 12px; border: none;
    background: #4caf50; color: white; font-weight: 900; cursor: pointer;
    box-shadow: 0 5px 0 #388e3c; transition: all 0.1s; margin-top: 10px;
  }
  .submit-btn:active { transform: translateY(5px); box-shadow: 0 0 0 #388e3c; }

  .feedback { height: 35px; font-size: 1.4rem; font-weight: 900; margin-top: 15px; text-transform: uppercase;}
  .correct { color: #2e7d32; }
  .wrong { color: #d32f2f; }

  /* Info text for instructions */
  .instructions { font-size: 0.9rem; color: #666; margin-bottom: 20px; font-style: italic; }

</style>
</head>
<body>

<div class="card">
  <button class="theme-btn" onclick="togglePinkMode()">🌸 PINK MODE</button>
  <h1>Math Scratchpad 📝</h1>
  <div class="instructions">Need to borrow or carry? Type in the boxes up top. Click a number to cross it out!</div>
  
  <div class="controls">
    <select id="opSelect" onchange="generateProblem()">
      <option value="+">Addition (+)</option>
      <option value="-">Subtraction (-)</option>
    </select>
    <select id="digitSelect" onchange="generateProblem()">
      <option value="2">2 Digits (e.g. 45)</option>
      <option value="3">3 Digits (e.g. 345)</option>
      <option value="4">4 Digits (e.g. 8947)</option>
    </select>
  </div>

  <div class="math-workspace" id="workspace">
    <!-- Grid is injected here by JavaScript -->
  </div>

  <button class="submit-btn" onclick="checkAnswer()">CHECK ANSWER ✅</button>
  <div class="feedback" id="feedback"></div>
</div>

<script>
  let currentAnswer = 0;
  let numColumns = 0;

  function togglePinkMode() {
    document.body.classList.toggle('pink-mode');
    const btn = document.querySelector('.theme-btn');
    if (document.body.classList.contains('pink-mode')) {
      btn.innerText = "🌌 BLUE MODE";
      btn.style.background = "#1e3c72";
      btn.style.boxShadow = "0 3px 0 #11254d";
    } else {
      btn.innerText = "🌸 PINK MODE";
      btn.style.background = "#ff0844";
      btn.style.boxShadow = "0 3px 0 #c2002f";
    }
  }

  function toggleStrike(el) {
    el.classList.toggle('strike');
  }

  function generateProblem() {
    document.getElementById('feedback').innerText = '';
    const digits = parseInt(document.getElementById('digitSelect').value);
    const op = document.getElementById('opSelect').value;

    // Generate max/min based on digit selection (e.g., 2 digits = 10 to 99)
    const min = Math.pow(10, digits - 1);
    const max = Math.pow(10, digits) - 1;

    let n1 = Math.floor(Math.random() * (max - min + 1)) + min;
    let n2 = Math.floor(Math.random() * (max - min + 1)) + min;

    // If subtraction, ensure top number is larger to avoid negative answers for 8yo
    if (op === '-' && n2 > n1) {
      let temp = n1; n1 = n2; n2 = temp;
    }

    currentAnswer = op === '+' ? n1 + n2 : n1 - n2;

    renderGrid(n1.toString(), n2.toString(), op);
  }

  function renderGrid(str1, str2, op) {
    const maxLen = Math.max(str1.length, str2.length) + 1; // +1 for the operator column
    numColumns = maxLen - 1; // Number of digit columns
    
    // Pad numbers with spaces so they align properly on the right
    str1 = str1.padStart(maxLen - 1, ' ');
    str2 = str2.padStart(maxLen - 1, ' ');

    let html = `<div class="math-grid" style="grid-template-columns: repeat(${maxLen}, auto);">`;

    // ROW 1: Scratchpad (Carries/Borrows)
    html += `<div></div>`; // Empty space over operator
    for (let i = 0; i < maxLen - 1; i++) {
      html += `<input type="text" maxlength="2" class="scratch-input" autocomplete="off">`;
    }

    // ROW 2: Top Number
    html += `<div></div>`; // Empty space over operator
    for (let i = 0; i < maxLen - 1; i++) {
      let char = str1[i];
      if (char !== ' ') {
        html += `<div class="digit-cell" onclick="toggleStrike(this)">${char}</div>`;
      } else {
        html += `<div></div>`;
      }
    }

    // ROW 3: Operator + Bottom Number
    html += `<div class="operator-cell">${op}</div>`;
    for (let i = 0; i < maxLen - 1; i++) {
      let char = str2[i];
      if (char !== ' ') {
        html += `<div class="digit-cell">${char}</div>`;
      } else {
        html += `<div></div>`;
      }
    }

    // DIVIDER
    html += `<div class="divider"></div>`;

    // ROW 4: Answer Inputs
    html += `<div></div>`; // Empty space under operator
    for (let i = 0; i < maxLen - 1; i++) {
      html += `<input type="text" maxlength="1" class="ans-input" id="ans-${i}" oninput="focusNext(event, ${i})" autocomplete="off">`;
    }

    html += `</div>`;
    document.getElementById('workspace').innerHTML = html;

    // Auto-focus the right-most answer box to start
    setTimeout(() => {
      document.getElementById(`ans-${numColumns - 1}`).focus();
    }, 100);
  }

  // Right-to-Left Auto Focus for Answer row
  function focusNext(event, currentIndex) {
    // If they type a number, jump to the box to the left
    if (event.target.value.length === 1 && currentIndex > 0) {
      document.getElementById(`ans-${currentIndex - 1}`).focus();
    }
  }

  function checkAnswer() {
    let userAnswerStr = '';
    for (let i = 0; i < numColumns; i++) {
      let val = document.getElementById(`ans-${i}`).value;
      userAnswerStr += val === '' ? '0' : val; // Treat blanks as leading zeros if they skipped the front box
    }

    const userAnswer = parseInt(userAnswerStr);
    const feedback = document.getElementById('feedback');

    if (userAnswer === currentAnswer) {
      feedback.innerText = "⭐ CORRECT! GREAT JOB! ⭐";
      feedback.className = "feedback correct";
      setTimeout(generateProblem, 1500);
    } else {
      feedback.innerText = "Not quite. Check your math!";
      feedback.className = "feedback wrong";
    }
  }

  // Allow pressing Enter to check answer
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      checkAnswer();
    }
  });

  // Start the first problem
  generateProblem();
</script>
</body>
</html>
